<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hizmet Geçici Olarak Durduruldu</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #0f172a; color: #f8fafc; padding: 24px; text-align: center; }
    .card { max-width: 480px; background: #1e293b; padding: 40px 32px; border-radius: 12px; border: 1px solid #334155; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3); }
    .badge { display: inline-block; padding: 6px 12px; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; background: #ef444420; color: #ef4444; border-radius: 9999px; margin-bottom: 20px; }
    h1 { font-size: 22px; font-weight: 600; margin-bottom: 12px; color: #ffffff; }
    p { font-size: 14px; line-height: 1.6; color: #94a3b8; margin-bottom: 24px; }
    .footer { font-size: 12px; color: #64748b; border-top: 1px solid #334155; padding-top: 16px; }
  </style>
</head>
<body>
  <div class="card">
    <span class="badge">Hizmet Askıda</span>
    <h1>Web Sitesi Erişime Kapatılmıştır</h1>
    <p>Alan adı / barındırma süresi sona erdiği için bu web sitesi geçici olarak erişime durdurulmuştur. Yenileme işlemleri için lütfen hizmet sağlayıcınız veya site yöneticiniz ile iletişime geçin.</p>
    <div class="footer">Status Code: 503 / Service Suspended</div>
  </div>
</body>
</html>
